name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix cloudfunctions/api
      - run: npm ci --prefix cloudfunctions/deletionWorker
      - run: npm ci --prefix cloudfunctions/processCardImage
      - run: npm ci --prefix cloudfunctions/scheduledCleanup
      - run: npm run gate
