name: Scheduled dependency security check

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

jobs:
  dependency-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run security:check
